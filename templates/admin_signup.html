<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Signup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
    <div class="container">
        <h2>Admin Signup</h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_signup') }}">
            <input type="text" name="new_username" placeholder="New Username" required>
            <input type="password" name="new_password" placeholder="New Password" required>
        
            <select name="region" required>
                <option value="" disabled selected>Select Region</option>
                <option value="01">Region I (Ilocos Region)</option>
                <option value="02">Region II (Cagayan Valley)</option>
                <option value="03">Region III (Central Luzon)</option>
                <!-- Add more region options as needed -->
            </select>
        
            <select name="province" required>
                <option value="" disabled selected>Select Province</option>
                <!-- Populate with JS or manually add options -->
            </select>
        
            <select name="city" required>
                <option value="" disabled selected>Select Municipality</option>
                <!-- Populate with JS or manually add options -->
            </select>
        
            <button type="submit">Sign Up</button>
        </form>
        

        <p>Already have an account? <a href="{{ url_for('admin_login') }}">Login here</a></p>

        <div class="back-btn">
            <button onclick="window.location.href='{{ url_for('home') }}'">Back</button>
        </div>
    </div>
</body>
</html>
